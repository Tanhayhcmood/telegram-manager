services:
  - type: web
    name: tg-group-manager
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    # Run DB migrations before starting the app.
    dockerCommand: ./start.sh

    envVars:
      # The safe deployment keeps the Telegram user-account client disabled.
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: BOT_MODE
        value: webhook
      - key: WEBHOOK_SECRET
        generateValue: true

      # --- Linked resources ---
      - key: DATABASE_URL
        fromDatabase:
          name: tg-manager-db
          property: connectionString

      # --- App settings ---
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: APP_ENV
        value: production
      - key: BACKUP_DIR
        value: /tmp/backups
      - key: BACKUP_KEEP_DAYS
        value: "7"
      - key: BACKUP_DAILY_HOUR
        value: "3"

      # --- Optional ---
      - key: DISCOVERY_KEYWORDS
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false

databases:
  - name: tg-manager-db
    databaseName: tgmanager
    user: tgmanager
    plan: free
    region: frankfurt
